<!DOCTYPE html>
<html lang="en" data-runtime-mode="hosted" data-runtime-variant="standard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Republic Command Center · W&R: Soviet Republic</title>
  <meta name="description" content="Republic Command Center for Workers & Resources: Soviet Republic. Observe saves or a local SDK feed, diagnose operations, and plan locally. Nothing is uploaded.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%98%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/vendor/leaflet.css?v=3">
  <link rel="stylesheet" href="css/vendor/uPlot.min.css?v=3">
  <link rel="stylesheet" href="css/style.css?v=145">
</head>
<body>
  <div id="app"><noscript>This planner needs JavaScript.</noscript>
    <div class="app-boot" data-app-boot role="status" aria-live="polite">
      <span class="app-boot-mark" aria-hidden="true"></span>
      <p class="app-boot-text">Loading all republic data…</p>
    </div>
  </div>
  <!-- The module graph cannot rescue itself. If a browser is holding a cached
       copy of one module and a fresh copy of another, the two may no longer
       agree on what is exported, and the whole graph fails to link: nothing
       runs, and the reader is left looking at the loading mark forever. This
       script imports nothing, so it always runs, and it reloads once past the
       cache. One retry only, so a genuine fault still surfaces. -->
  <script>
    (function () {
      if ((navigator.language || '').toLowerCase().indexOf('de') === 0) {
        var line = document.querySelector('.app-boot-text');
        if (line) line.textContent = 'Alle Republikdaten werden geladen \u2026';
      }
    }());
    (function () {
      var KEY = 'appBootRetry';
      var retried = sessionStorage.getItem(KEY);
      function recover(reason) {
        if (retried || !window.location.protocol.startsWith('http')) return;
        sessionStorage.setItem(KEY, reason);
        var url = new URL(window.location.href);
        url.searchParams.set('reload', String(Date.now()));
        window.location.replace(url);
      }
      window.addEventListener('error', function (event) {
        var text = String((event && event.message) || '');
        if (/does not provide an export|Failed to fetch dynamically imported|error loading dynamically imported|Unexpected token/i.test(text)) {
          recover('link');
        }
      });
      window.addEventListener('load', function () {
        // A graph that never linked leaves the placeholder exactly as served.
        setTimeout(function () {
          var app = document.getElementById('app');
          if (app && app.querySelector('[data-app-boot]')) recover('stalled');
        }, 8000);
      });
      window.addEventListener('appready', function () { sessionStorage.removeItem(KEY); });
    }());
  </script>
  <script type="module" src="js/app.js?v=399"></script>
</body>
</html>
